name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Full SSG Bundle
        run: npm run build

      - name: Deploy Out Directory to Cloudflare Pages
        # 原用 cloudflare/pages-action@v1，该 action 已被 GitHub 下架（Unable to resolve action），
        # 导致 2026-08-24 起所有部署在 "Set up job" 阶段就失败。改为直接跑 wrangler，
        # 与本账号其他站（roguewiki / deepseek-v4-guide / xknow）保持一致。
        run: npx --yes wrangler@4 pages deploy out --project-name billsschedule2026 --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
